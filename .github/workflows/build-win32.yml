name: Build Windows 32-bit

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            base-devel
            curl
            tar
            bzip2
            zip
            mingw-w64-i686-toolchain
            mingw-w64-i686-cmake
            mingw-w64-i686-ninja
            mingw-w64-i686-zlib
            mingw-w64-i686-portaudio
            mingw-w64-i686-pkgconf
      - name: Build fftw
        run: |
          mkdir -p $HOME/deps && cd $HOME/deps
          curl -fLO https://www.fftw.org/fftw-3.3.10.tar.gz
          tar xzf fftw-3.3.10.tar.gz && cd fftw-3.3.10
          ./configure --prefix=/mingw32 --enable-shared --disable-static --with-our-malloc --disable-fortran
          make -j4 && make install
      - name: Build mxml
        run: |
          cd $HOME/deps
          curl -fLO https://github.com/michaelrsweet/mxml/releases/download/v2.12/mxml-2.12.tar.gz
          tar xzf mxml-2.12.tar.gz && cd mxml-2.12
          CFLAGS="-include io.h -Wno-error=implicit-function-declaration" ./configure --prefix=/mingw32 --disable-shared
          make libmxml.a
          cp mxml.h /mingw32/include/
          cp libmxml.a /mingw32/lib/
          mkdir -p /mingw32/lib/pkgconfig
          cat > /mingw32/lib/pkgconfig/mxml.pc <<PCEOF
          prefix=/mingw32
          libdir=\${prefix}/lib
          includedir=\${prefix}/include
          Name: mxml
          Description: Mini-XML library
          Version: 2.12
          Libs: -L\${libdir} -lmxml
          Cflags: -I\${includedir}
          PCEOF
      - name: Build liblo
        env:
          CFLAGS: -O2 -Wno-error=implicit-function-declaration -Wno-error=int-conversion
        run: |
          cd $HOME/deps
          curl -fLO https://github.com/radarsat1/liblo/releases/download/0.32/liblo-0.32.tar.gz
          tar xzf liblo-0.32.tar.gz && cd liblo-0.32
          ./configure --prefix=/mingw32 --enable-shared --disable-static --disable-tests --disable-examples --disable-tools
          make -j4 && make install
      - name: Build fltk
        run: |
          cd $HOME/deps
          curl -fLO https://www.fltk.org/pub/fltk/1.3.9/fltk-1.3.9-source.tar.gz
          tar xzf fltk-1.3.9-source.tar.gz && cd fltk-1.3.9
          ./configure --prefix=/mingw32 --disable-gl
          make -j4 && make install
      - name: Unpack source
        run: |
          tar xjf zynaddsubfx-3.0.3-bluegreen-theme.tar.bz2
          cd zynaddsubfx-3.0.3
          sed -i 's|COMMAND ${FLTK_CONFIG} --use-images --ldflags|COMMAND sh ${FLTK_CONFIG} --use-images --ldflags|' src/CMakeLists.txt
          sed -i 's|string(STRIP ${FLTK_LDFLAGS} FLTK_LIBRARIES)|if(NOT FLTK_LDFLAGS)\n\t\t\tset(FLTK_LDFLAGS "-mwindows -lfltk_images -lfltk_png -lfltk_z -lfltk_jpeg -lfltk -lole32 -luuid -lcomctl32 -lwsock32 -lm -lgdi32 -lcomdlg32")\n\t\tendif()\n\t\tstring(STRIP "${FLTK_LDFLAGS}" FLTK_LIBRARIES)\n\t\tstring(REPLACE "-mwindows" "-mconsole" FLTK_LIBRARIES "${FLTK_LIBRARIES}")|' src/CMakeLists.txt
          sed -n 363,375p src/CMakeLists.txt
          sed -i 's|^fl_open_display();$|\\#ifndef _WIN32\nfl_open_display();\n\\#endif|' src/UI/MasterUI.fl
          grep -n -B1 -A1 "fl_open_display" src/UI/MasterUI.fl
          sed -i 's/\bindex(/strchr(/g' src/UI/Fl_Osc_Tree.H
          grep -n "strchr(" src/UI/Fl_Osc_Tree.H
          cat > src/crashreport.h <<'CRASHEOF'
          #pragma once
          #ifdef WIN32
          #include <windows.h>
          #include <dbghelp.h>
          #include <stdio.h>
          #include <string.h>

          typedef BOOL    (WINAPI *zyn_SymInitialize_t)(HANDLE, const char *, BOOL);
          typedef BOOL    (WINAPI *zyn_SymFromAddr_t)(HANDLE, DWORD64, DWORD64 *, SYMBOL_INFO *);
          typedef BOOL    (WINAPI *zyn_StackWalk64_t)(DWORD, HANDLE, HANDLE, void *, void *,
                                                      void *, void *, void *, void *);
          typedef DWORD   (WINAPI *zyn_SymSetOptions_t)(DWORD);
          typedef void *  (WINAPI *zyn_SymFunctionTableAccess64_t)(HANDLE, DWORD64);
          typedef DWORD64 (WINAPI *zyn_SymGetModuleBase64_t)(HANDLE, DWORD64);

          static LONG WINAPI zyn_crash_handler(EXCEPTION_POINTERS *ep)
          {
              unsigned long base = (unsigned long)GetModuleHandle(NULL);
              unsigned long addr = (unsigned long)ep->ExceptionRecord->ExceptionAddress;
              fprintf(stderr, "\n[CRASH] exception code 0x%08lX at 0x%08lX (exe base 0x%08lX, offset 0x%lX)\n",
                      (unsigned long)ep->ExceptionRecord->ExceptionCode, addr, base, addr - base);
              HMODULE dh = LoadLibraryA("dbghelp.dll");
              if(dh) {
                  zyn_SymInitialize_t pSymInitialize = (zyn_SymInitialize_t)GetProcAddress(dh, "SymInitialize");
                  zyn_SymFromAddr_t pSymFromAddr = (zyn_SymFromAddr_t)GetProcAddress(dh, "SymFromAddr");
                  zyn_StackWalk64_t pStackWalk64 = (zyn_StackWalk64_t)GetProcAddress(dh, "StackWalk64");
                  zyn_SymSetOptions_t pSymSetOptions = (zyn_SymSetOptions_t)GetProcAddress(dh, "SymSetOptions");
                  zyn_SymFunctionTableAccess64_t pFuncTable =
                      (zyn_SymFunctionTableAccess64_t)GetProcAddress(dh, "SymFunctionTableAccess64");
                  zyn_SymGetModuleBase64_t pModBase =
                      (zyn_SymGetModuleBase64_t)GetProcAddress(dh, "SymGetModuleBase64");
                  if(pSymInitialize && pSymFromAddr && pStackWalk64 && pFuncTable && pModBase) {
                      HANDLE proc = GetCurrentProcess();
                      HANDLE thr  = GetCurrentThread();
                      if(pSymSetOptions)
                          pSymSetOptions(0x2); /* SYMOPT_UNDNAME */
                      pSymInitialize(proc, NULL, TRUE);
                      CONTEXT ctx = *ep->ContextRecord;
                      STACKFRAME64 frame;
                      memset(&frame, 0, sizeof(frame));
                      frame.AddrPC.Offset    = ctx.Eip;
                      frame.AddrPC.Mode      = AddrModeFlat;
                      frame.AddrFrame.Offset = ctx.Ebp;
                      frame.AddrFrame.Mode   = AddrModeFlat;
                      frame.AddrStack.Offset = ctx.Esp;
                      frame.AddrStack.Mode   = AddrModeFlat;
                      for(int i = 0; i < 25; i++) {
                          if(!pStackWalk64(0x14c, proc, thr, &frame, &ctx, NULL,
                                           (void *)pFuncTable, (void *)pModBase, NULL))
                              break;
                          if(frame.AddrPC.Offset == 0)
                              break;
                          union { SYMBOL_INFO s; char pad[sizeof(SYMBOL_INFO) + 300]; } u;
                          memset(&u, 0, sizeof(u));
                          u.s.SizeOfStruct = sizeof(SYMBOL_INFO);
                          u.s.MaxNameLen   = 299;
                          DWORD64 disp = 0;
                          unsigned long pc = (unsigned long)frame.AddrPC.Offset;
                          if(pSymFromAddr(proc, frame.AddrPC.Offset, &disp, &u.s))
                              fprintf(stderr, "[CRASH]  #%d %s +0x%lX (0x%08lX)\n",
                                      i, u.s.Name, (unsigned long)disp, pc);
                          else
                              fprintf(stderr, "[CRASH]  #%d 0x%08lX (offset 0x%lX)\n", i, pc, pc - base);
                      }
                  }
              }
              fflush(stderr);
              return EXCEPTION_EXECUTE_HANDLER;
          }
          #endif
          CRASHEOF
          sed -i 's|^GUI::ui_handle_t gui;$|#include "crashreport.h"\nGUI::ui_handle_t gui;|' src/main.cpp
          sed -i 's|^    int noui = 0;$|    int noui = 0;\n#ifdef WIN32\n    SetUnhandledExceptionFilter(zyn_crash_handler);\n#endif|' src/main.cpp
          grep -n "crashreport\|zyn_crash_handler" src/main.cpp
          sed -i '0,/uToB->write("\/freeze_state","");/s|uToB->write("/freeze_state","");|&\n    fprintf(stderr, "[SAVE] asking backend to freeze\\n");|' src/Misc/MiddleWare.cpp
          sed -i '0,/assert(tries < 10000);/s|assert(tries < 10000);|fprintf(stderr, "[SAVE] wait finished after %d tries (10000 = backend never answered)\\n", tries);\n    assert(tries < 10000);|' src/Misc/MiddleWare.cpp
          sed -i 's|^\( *\)int res = master->part\[npart\]->saveXML(fname.c_str());|\1fprintf(stderr, "[SAVE] writing file: %s\\n", fname.c_str());\n\1int res = master->part[npart]->saveXML(fname.c_str());\n\1fprintf(stderr, "[SAVE] write finished, result %d\\n", res);|' src/Misc/MiddleWare.cpp
          grep -n "\[SAVE\]" src/Misc/MiddleWare.cpp
          sed -i 's|o->color( FL_CYAN );|o->color( fl_rgb_color(12, 52, 40) );|' src/UI/guimain.cpp
          sed -i 's|^    Fl::add_handler(kb_shortcut_handler);$|    Fl::background(14, 18, 24);\n    Fl::background2(22, 30, 40);\n    Fl::foreground(215, 240, 230);\n    Fl::set_color(FL_SELECTION_COLOR, 0, 200, 110);\n    Fl::add_handler(kb_shortcut_handler);|' src/UI/guimain.cpp
          sed -i 's|pdialcolor(10, 14, 20);|pdialcolor(6, 24, 14);|; s|fl_color(20, 90, 160);|fl_color(30, 150, 80);|; s|pdialcolor(25, 35, 48);|pdialcolor(16, 84, 48);|; s|pdialcolor(12, 18, 26);|pdialcolor(22, 110, 64);|; s|pdialcolor(80, 170, 255);|pdialcolor(200, 255, 220);|' src/UI/WidgetPDial.cpp
          grep -n "fl_rgb_color(12\|Fl::background(14" src/UI/guimain.cpp
          grep -n "pdialcolor(\|fl_color(30" src/UI/WidgetPDial.cpp | head -8
          sed -i 's|^        middleware->tick();$|#if defined(WIN32) \&\& !defined(ZEST_GUI)\n        if(!noui) GUI::tickUi(gui);\n#endif\n        middleware->tick();|' src/main.cpp
          sed -n 715,730p src/main.cpp
      - name: Configure
        run: |
          cd zynaddsubfx-3.0.3
          mkdir build && cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_CXX_FLAGS="-include cstdint" \
            -DGuiModule=fltk -DPaEnable=ON \
            -DJackEnable=OFF -DAlsaEnable=OFF -DOssEnable=OFF
      - name: Build standalone exe
        run: |
          cd zynaddsubfx-3.0.3/build
          set +e
          ninja -k 0 zynaddsubfx > ../../build.log 2>&1
          STATUS=$?
          echo "================ ERROR SUMMARY (scroll here) ================"
          grep -n -E "error:|FAILED:|undefined reference|fatal error" ../../build.log | head -40
          echo "================ LAST 15 LINES ================"
          tail -n 15 ../../build.log
          echo "ninja exit code: $STATUS"
          exit $STATUS
      - name: Build VST (optional)
        continue-on-error: true
        run: |
          cd zynaddsubfx-3.0.3/build
          set +e
          ninja -k 0 ZynAddSubFX_vst > ../../build-vst.log 2>&1
          STATUS=$?
          echo "================ VST ERROR SUMMARY ================"
          grep -n -E "error:|FAILED:|undefined reference|fatal error" ../../build-vst.log | head -40
          echo "================ LAST 15 LINES ================"
          tail -n 15 ../../build-vst.log
          echo "ninja exit code: $STATUS"
          exit $STATUS
      - name: Collect files
        run: |
          mkdir -p out
          # copy every non-system DLL a file needs (and what those DLLs need)
          copydeps() {
            local file="$1" dest="$2"
            for dll in $(objdump -p "$file" | grep "DLL Name" | awk '{print $3}'); do
              if [ -f "/mingw32/bin/$dll" ] && [ ! -f "$dest/$dll" ]; then
                cp "/mingw32/bin/$dll" "$dest/"
                echo "bundled $dll"
                copydeps "/mingw32/bin/$dll" "$dest"
              fi
            done
          }
          EXE=$(find zynaddsubfx-3.0.3/build -name zynaddsubfx.exe | head -n 1)
          cp "$EXE" out/
          copydeps out/zynaddsubfx.exe out
          VST=$(find zynaddsubfx-3.0.3/build -name ZynAddSubFX.dll | head -n 1)
          if [ -n "$VST" ]; then
            mkdir -p out/vst
            cp "$VST" out/vst/
            copydeps out/vst/ZynAddSubFX.dll out/vst
          fi
          cp -r zynaddsubfx-3.0.3/instruments out/ || true
          cp -r zynaddsubfx-3.0.3/pixmaps out/ || true
          echo "===== FILES IN ZIP ====="
          ls -R out | head -n 60
          cd out && zip -r ../zynaddsubfx-win32.zip .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zynaddsubfx-win32
          path: zynaddsubfx-win32.zip
